﻿<!DOCTYPE html>

<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
	<link rel="stylesheet" href="calc.css">
    <title>Calc</title>
</head>
<body>
	<div class="main-window">
		<div class="title-bar">
			<div class="icon-and-title">
				<img src="img/CalcXP.ico" class="iconsm">	&#8213; Калькулятор
			</div>
			<div class="title-bar-window-control-buttons">
				<button class="control-buttons"><div class="control-button-signature">&#x1F5D5</div></button>
				<button class="control-buttons" disabled><div class="control-button-signature">&#128470</div></button>
				<button class="control-buttons close-button"><div class="close-button-signature">&#10006</div></button>
			</div>
		</div>
		<!-- ------------------------------------------------ -->
		<div class="client-frame">
			<div class="client-rect">
				<div class="menu-bar">
					<button>Edit</button>
					<button>View</button>
					<button>Help</button>
				</div>
				<div class="display-container">
					<input type="text" value="0" id="display"/>
				</div>
				<div class="buttons-container">
					<div class="square"></div>
					<div class="clear-buttons">
						<button>Backspace</button>
						<button>CE</button>
						<button>C</button>
					</div>
					<button class="memory-button">MC</button>
					<button id="7" class="digit-button">7</button>
					<button id="8" class="digit-button">8</button>
					<button id="9" class="digit-button">9</button>
					<button class="operation-button">/</button>
					<button>sqrt</button>

					<button class="memory-button">MR</button>
					<button id="4" class="digit-button">4</button>
					<button id="5" class="digit-button">5</button>
					<button id="6" class="digit-button">6</button>
					<button class="operation-button">*</button>
					<button>%</button>

					<button class="memory-button">MS</button>
					<button id="1" class="digit-button">1</button>
					<button id="2" class="digit-button">2</button>
					<button id="3" class="digit-button">3</button>
					<button class="operation-button">-</button>
					<button>1/x</button>

					<button class="memory-button">M+</button>
					<button id="0" class="digit-button">0</button>
					<button>+/-</button>
					<button id="." class="digit-button">.</button>
					<button class="operation-button">+</button>
					<button class="operation-button">=</button>

				</div>
			</div>
		</div>
	</div>
	<script src="calc.js"></script>
</body>
</html>
